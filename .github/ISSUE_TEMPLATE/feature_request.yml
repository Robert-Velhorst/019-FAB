name: Feature request
description: Suggest an improvement
title: "[Feature]: "
body:
  - type: markdown
    attributes:
      value: "Do not include credentials, personal data, or private production records."
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: What need or limitation would this address?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false

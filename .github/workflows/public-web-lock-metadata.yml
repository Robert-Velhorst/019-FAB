name: FAB public web lock metadata

on:
  pull_request:
    paths:
      - web/pnpm-lock.yaml
      - web/package.json
      - web/pnpm-workspace.yaml
      - web/vendor/tailwindcss-typography/**
      - .github/workflows/public-web-lock-metadata.yml

permissions:
  contents: read

concurrency:
  group: fab-public-web-lock-${{ github.ref }}
  cancel-in-progress: true

jobs:
  public-web-lock:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact candidate source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up current stable Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.12.1'
      - name: Set up pinned current stable pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.16.1
          run_install: false
      - name: Record exact metadata input
        run: |
          mkdir -p /tmp/fab-public-lock
          python - <<'PY'
          import hashlib, json, pathlib, subprocess
          payload = pathlib.Path('web/package.json').read_bytes()
          record = {
              'git_head': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(),
              'package_json_sha256': hashlib.sha256(payload).hexdigest(),
              'node': subprocess.check_output(['node', '--version'], text=True).strip(),
              'pnpm': subprocess.check_output(['pnpm', '--version'], text=True).strip(),
              'scope': 'Normal lock metadata only; no application or case acceptance',
          }
          pathlib.Path('/tmp/fab-public-lock/input.json').write_text(json.dumps(record, indent=2))
          pathlib.Path('/tmp/fab-public-lock/package.json').write_bytes(payload)
          PY
      - name: Resolve normal lock with strict peer and engine checks
        run: pnpm --dir web install --lockfile-only --ignore-scripts --strict-peer-dependencies --no-frozen-lockfile
      - name: Refresh the complete indirect graph normally without saving manifest changes
        run: pnpm --dir web update --depth Infinity --lockfile-only --ignore-scripts --strict-peer-dependencies --no-save
      - name: Require every tracked payload except the normal lock to remain unchanged
        shell: python
        run: |
          import hashlib,json,pathlib,subprocess
          changed=subprocess.check_output(['git','diff','--name-only'],text=True).splitlines()
          assert set(changed)<={'web/pnpm-lock.yaml'},changed
          expected=json.loads(pathlib.Path('/tmp/fab-public-lock/input.json').read_text())
          assert hashlib.sha256(pathlib.Path('web/package.json').read_bytes()).hexdigest()==expected['package_json_sha256']
      - name: Retain resolved lock and immutable input
        run: cp web/pnpm-lock.yaml /tmp/fab-public-lock/pnpm-lock.yaml
      - name: Require the complete refreshed dependency audit to have no findings
        run: pnpm --dir web audit --audit-level=low --json > /tmp/fab-public-lock/full-audit.json
      - name: Inventory every public namespace and require current stable security targets
        run: python .github/scripts/fab_public_graph_metadata.py
      - name: Upload exact lock metadata
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fab-public-web-lock-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/fab-public-lock
          if-no-files-found: error
          retention-days: 14

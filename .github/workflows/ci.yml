name: FAB verification

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fab-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-linux:
    name: Backend (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned uv for lock verification
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.11.26"
          enable-cache: false
      - name: Verify Python dependency locks
        run: python scripts/compile_python_locks.py --verify
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.15.0"
          cache: pip
          cache-dependency-path: requirements-test.lock
      - name: Install Python dependencies
        run: python -m pip install --disable-pip-version-check --require-hashes -r requirements-test.lock
      - name: Audit Python dependency locks
        run: python -m pip_audit --progress-spinner=off --format=markdown --require-hashes -r requirements.lock -r requirements-local.lock -r requirements-ml.lock -r requirements-test.lock
      - name: Run backend suite
        run: python -m pytest -q -p no:cacheprovider -p no:stepwise
      - name: Rehearse synthetic source-complete recovery
        run: python -m src.run_recovery_rehearsal
      - name: Validate VM deployment configuration
        env:
          FAB_OPERATOR_PUBLIC_ORIGIN: https://fab.example.test
          FAB_LEDGER_PUBLIC_ORIGIN: https://ledger.example.test
          FAB_TRUSTED_PROXY_ADDRESSES: 127.0.0.1
          FAB_INTAKE_DIR: /tmp/fab-synthetic-intake
          FAB_API_TOKEN_FILE: /tmp/fab-synthetic-api-token
          FAB_SESSION_SECRET_FILE: /tmp/fab-synthetic-session-secret
          FAB_OPERATOR_TOKEN_FILE: /tmp/fab-synthetic-operator-token
        run: docker compose -f docker-compose.vm.yml config --quiet
      - name: Validate optional restricted HAI deployment configuration
        env:
          FAB_OPERATOR_PUBLIC_ORIGIN: https://fab.example.test
          FAB_LEDGER_PUBLIC_ORIGIN: https://ledger.example.test
          FAB_TRUSTED_PROXY_ADDRESSES: 127.0.0.1
          FAB_INTAKE_DIR: /tmp/fab-synthetic-intake
          FAB_API_TOKEN_FILE: /tmp/fab-synthetic-api-token
          FAB_SESSION_SECRET_FILE: /tmp/fab-synthetic-session-secret
          FAB_OPERATOR_TOKEN_FILE: /tmp/fab-synthetic-operator-token
          FAB_HAI_TOKEN_FILE: /tmp/fab-synthetic-hai-token
        run: docker compose -f docker-compose.vm.yml -f docker-compose.vm.hai.yml config --quiet

  backend-windows:
    name: Backend (Windows ${{ matrix.shard }}/4)
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-test.lock
      - name: Create checkout-local Python runtime
        run: python -m venv .venv
      - name: Install Python dependencies in checkout-local runtime
        run: .venv\Scripts\python.exe -m pip install --disable-pip-version-check --require-hashes -r requirements-test.lock
      - name: Run backend shard
        shell: pwsh
        env:
          FAB_TEST_SHARD: ${{ matrix.shard }}
          FAB_TEST_SHARDS: 4
        run: |
          $files = @(Get-ChildItem tests -Filter "test_*.py" | Sort-Object Name)
          $selected = @()
          for ($index = 0; $index -lt $files.Count; $index++) {
            if (($index % [int]$env:FAB_TEST_SHARDS) -eq ([int]$env:FAB_TEST_SHARD - 1)) {
              $selected += $files[$index].FullName
            }
          }
          Write-Host "Running shard $env:FAB_TEST_SHARD/$env:FAB_TEST_SHARDS with $($selected.Count) test files."
          & .venv\Scripts\python.exe -m pytest -q -p no:cacheprovider -p no:stepwise $selected
          exit $LASTEXITCODE
      - name: Set up pnpm for Windows stack rehearsal
        if: matrix.shard == 1
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.20.0
          run_install: false
      - name: Set up Node.js for Windows stack rehearsal
        if: matrix.shard == 1
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26.12.0"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install and build Windows dashboard
        if: matrix.shard == 1
        run: |
          pnpm --dir web install --frozen-lockfile
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm --dir web build
          exit $LASTEXITCODE
      - name: Rehearse Windows dashboard API and ledger
        if: matrix.shard == 1
        run: .venv\Scripts\python.exe scripts/run_stack_rehearsal.py

  frontend:
    name: Frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.20.0
          run_install: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26.12.0"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install frontend dependencies
        run: pnpm --dir web install --frozen-lockfile
      - name: Audit frontend dependencies
        working-directory: web
        run: pnpm audit --audit-level=high
      - name: Check frontend peer dependencies
        working-directory: web
        run: pnpm peers check
      - name: Type-check frontend
        run: pnpm --dir web check
      - name: Run frontend suite
        run: pnpm --dir web test
      - name: Build production frontend
        run: pnpm --dir web build
      - name: Set up Python for Linux stack rehearsal
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.15.0"
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install API dependencies for Linux stack rehearsal
        run: python -m pip install --disable-pip-version-check --require-hashes -r requirements.lock
      - name: Rehearse Linux dashboard API and ledger
        run: python scripts/run_stack_rehearsal.py

  container-build:
    name: Container build (${{ matrix.component }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: api
            context: .
            dockerfile: Dockerfile
          - component: dashboard
            context: ./web
            dockerfile: ./web/Dockerfile
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build production container without publishing
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: false
          tags: local/fab-${{ matrix.component }}:${{ github.sha }}
          cache-from: type=gha,scope=ci-${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=ci-${{ matrix.component }}

  database-integration:
    name: Web database integration (MySQL)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: fab-ci-only-password
          MYSQL_DATABASE: fab_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --host=127.0.0.1 --user=root --password=fab-ci-only-password --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up pnpm
        uses: pnpm/action-setup@ff378ebe6b225b0680b81c1ad4498ae0d1d3a5e3 # v6.0.10
        with:
          version: 11.20.0
          run_install: false
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "26.12.0"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install web dependencies
        run: pnpm --dir web install --frozen-lockfile
      - name: Apply tracked database migrations
        working-directory: web
        env:
          DATABASE_URL: mysql://root:fab-ci-only-password@127.0.0.1:3306/fab_test
        run: pnpm run db:migrate
      - name: Verify migration rerun is idempotent
        working-directory: web
        env:
          DATABASE_URL: mysql://root:fab-ci-only-password@127.0.0.1:3306/fab_test
        run: pnpm run db:migrate
      - name: Exercise MySQL-backed audit and transaction paths
        working-directory: web
        env:
          FAB_MYSQL_INTEGRATION_URL: mysql://root:fab-ci-only-password@127.0.0.1:3306/fab_test
        run: pnpm exec vitest run server/db.mysql.integration.test.ts

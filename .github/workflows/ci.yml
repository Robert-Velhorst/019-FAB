name: FAB verification

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: fab-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-linux:
    name: Backend (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install Python dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt pytest
      - name: Run backend suite
        run: python -m pytest -q -p no:cacheprovider -p no:stepwise
      - name: Rehearse synthetic source-complete recovery
        run: python -m src.run_recovery_rehearsal
      - name: Validate VM deployment configuration
        env:
          FAB_OPERATOR_PUBLIC_ORIGIN: https://fab.example.test
          FAB_LEDGER_PUBLIC_ORIGIN: https://ledger.example.test
          FAB_TRUSTED_PROXY_ADDRESSES: 127.0.0.1
          FAB_INTAKE_DIR: /tmp/fab-synthetic-intake
          FAB_API_TOKEN_FILE: /tmp/fab-synthetic-api-token
          FAB_SESSION_SECRET_FILE: /tmp/fab-synthetic-session-secret
          FAB_OPERATOR_TOKEN_FILE: /tmp/fab-synthetic-operator-token
        run: docker compose -f docker-compose.vm.yml config --quiet

  backend-windows:
    name: Backend (Windows ${{ matrix.shard }}/4)
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install Python dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt pytest
      - name: Run backend shard
        shell: pwsh
        env:
          FAB_TEST_SHARD: ${{ matrix.shard }}
          FAB_TEST_SHARDS: 4
        run: |
          $files = @(Get-ChildItem tests -Filter "test_*.py" | Sort-Object Name)
          $selected = @()
          for ($index = 0; $index -lt $files.Count; $index++) {
            if (($index % [int]$env:FAB_TEST_SHARDS) -eq ([int]$env:FAB_TEST_SHARD - 1)) {
              $selected += $files[$index].FullName
            }
          }
          Write-Host "Running shard $env:FAB_TEST_SHARD/$env:FAB_TEST_SHARDS with $($selected.Count) test files."
          & python -m pytest -q -p no:cacheprovider -p no:stepwise $selected
          exit $LASTEXITCODE
      - name: Set up pnpm for Windows stack rehearsal
        if: matrix.shard == 1
        uses: pnpm/action-setup@ff378ebe6b225b0680b81c1ad4498ae0d1d3a5e3 # v6.0.10
        with:
          version: 11.20.0
          run_install: false
      - name: Set up Node.js for Windows stack rehearsal
        if: matrix.shard == 1
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install and build Windows dashboard
        if: matrix.shard == 1
        run: |
          pnpm --dir web install --frozen-lockfile
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm --dir web build
          exit $LASTEXITCODE
      - name: Rehearse Windows dashboard API and ledger
        if: matrix.shard == 1
        run: python scripts/run_stack_rehearsal.py

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up pnpm
        uses: pnpm/action-setup@ff378ebe6b225b0680b81c1ad4498ae0d1d3a5e3 # v6.0.10
        with:
          version: 11.20.0
          run_install: false
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install frontend dependencies
        run: pnpm --dir web install --frozen-lockfile
      - name: Audit frontend dependencies
        working-directory: web
        run: pnpm audit --audit-level=high
      - name: Check frontend peer dependencies
        working-directory: web
        run: pnpm peers check
      - name: Type-check frontend
        run: pnpm --dir web check
      - name: Run frontend suite
        run: pnpm --dir web test
      - name: Build production frontend
        run: pnpm --dir web build
      - name: Set up Python for Linux stack rehearsal
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install API dependencies for Linux stack rehearsal
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Rehearse Linux dashboard API and ledger
        run: python scripts/run_stack_rehearsal.py

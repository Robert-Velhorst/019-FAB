name: Publish FAB container packages

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing semantic-version tag to publish
        required: true
        type: string
      confirm_private_packages:
        description: Confirm both GHCR packages are private and grant this repository Actions write access
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: fab-ghcr-release
  cancel-in-progress: false

jobs:
  preflight:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    name: Verify private packages and release source
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      packages: read
    outputs:
      release_tag: ${{ steps.release.outputs.tag }}
      release_sha: ${{ steps.release.outputs.sha }}
    steps:
      - name: Check out the selected release tag
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref }}

      - name: Require a semantic version reachable from main
        id: release
        env:
          RELEASE_TAG_INPUT: ${{ inputs.release_tag }}
          CONFIRM_PRIVATE_PACKAGES: ${{ inputs.confirm_private_packages }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" && "$CONFIRM_PRIVATE_PACKAGES" != "true" ]]; then
            echo "::error::Manual publishing requires explicit confirmation that both GHCR packages are private."
            exit 1
          fi
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            RELEASE_TAG="$RELEASE_TAG_INPUT"
          else
            RELEASE_TAG="$GITHUB_REF_NAME"
          fi
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Release tags must use semantic versioning, for example v0.1.0-preview.1."
            exit 1
          fi
          git check-ref-format "refs/tags/$RELEASE_TAG"
          RELEASE_SHA="$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$RELEASE_SHA" FETCH_HEAD || {
            echo "::error::Release tag must point to a commit reachable from main."
            exit 1
          }
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "sha=$RELEASE_SHA" >> "$GITHUB_OUTPUT"

      - name: Verify both GHCR packages exist and are private
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          for package in fab-api fab-dashboard; do
            visibility="$(gh api "/users/${GITHUB_REPOSITORY_OWNER}/packages/container/$package" --jq '.visibility')"
            if [[ "$visibility" != "private" ]]; then
              echo "::error::GHCR package $package must already exist and be private. No image was published."
              exit 1
            fi
          done

  publish:
    needs: preflight
    name: Publish ${{ matrix.component }} image
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: api
            image: fab-api
            context: .
            dockerfile: Dockerfile
          - component: dashboard
            image: fab-dashboard
            context: ./web
            dockerfile: Dockerfile
    steps:
      - name: Check out the selected release tag
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.preflight.outputs.release_tag }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish immutable release image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.context }}/${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ghcr.io/robert-velhorst/${{ matrix.image }}:${{ needs.preflight.outputs.release_tag }}
          provenance: mode=max
          sbom: true
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.title=FAB ${{ matrix.component }}
            org.opencontainers.image.version=${{ needs.preflight.outputs.release_tag }}
            org.opencontainers.image.revision=${{ needs.preflight.outputs.release_sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  promote-edge:
    needs: [preflight, publish]
    name: Promote edge aliases after both images publish
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      packages: write
    strategy:
      fail-fast: true
      matrix:
        image: [fab-api, fab-dashboard]
    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Promote immutable release image to edge
        env:
          IMAGE: ghcr.io/robert-velhorst/${{ matrix.image }}
          RELEASE_TAG: ${{ needs.preflight.outputs.release_tag }}
        run: |
          set -euo pipefail
          docker buildx imagetools create --tag "$IMAGE:edge" "$IMAGE:$RELEASE_TAG"

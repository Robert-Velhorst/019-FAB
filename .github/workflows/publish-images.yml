name: Publish FAB container packages

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      confirm_private_packages:
        description: "Confirm both GHCR packages were pre-created with private, granular access"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    name: Publish ${{ matrix.component }} image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: api
            image: fab-api
            context: .
            dockerfile: Dockerfile
          - component: dashboard
            image: fab-dashboard
            context: ./web
            dockerfile: Dockerfile
    steps:
      - name: Require explicit confirmation for manual dispatch
        if: github.event_name == 'workflow_dispatch'
        env:
          CONFIRM_PRIVATE_PACKAGES: ${{ inputs.confirm_private_packages }}
        run: |
          if [ "$CONFIRM_PRIVATE_PACKAGES" != "true" ]; then
            echo "::error::Confirm that both GHCR packages are private before publishing."
            exit 1
          fi

      - name: Verify the existing GHCR package is private
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PACKAGE_NAME: ${{ matrix.image }}
        run: |
          set -euo pipefail
          visibility="$(gh api "/users/${GITHUB_REPOSITORY_OWNER}/packages/container/${PACKAGE_NAME}" --jq '.visibility')"
          if [ "$visibility" != "private" ]; then
            echo "::error::GHCR package ${PACKAGE_NAME} must already exist and be private. No image was published."
            exit 1
          fi

      - name: Check out the published release tag
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish release image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.context }}/${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/robert-velhorst/${{ matrix.image }}:${{ github.ref_name }}
            ghcr.io/robert-velhorst/${{ matrix.image }}:edge
          provenance: mode=max
          sbom: true
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.title=FAB ${{ matrix.component }}
            org.opencontainers.image.version=${{ github.ref_name }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

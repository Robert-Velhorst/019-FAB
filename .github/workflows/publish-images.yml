name: Publish FAB container packages

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: fab-ghcr-release
  cancel-in-progress: false

jobs:
  preflight:
    if: startsWith(github.ref, 'refs/tags/v')
    name: Verify private packages and release source
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      packages: read
    steps:
      - name: Check out the release tag
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Require a semantic version reachable from main
        run: |
          set -euo pipefail
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release tags must use vMAJOR.MINOR.PATCH."
            exit 1
          fi
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" FETCH_HEAD

      - name: Verify both GHCR packages exist and are private
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          for package in fab-api fab-dashboard; do
            visibility="$(gh api "/users/${GITHUB_REPOSITORY_OWNER}/packages/container/$package" --jq '.visibility')"
            if [ "$visibility" != "private" ]; then
              echo "::error::GHCR package $package must already exist and be private. No image was published."
              exit 1
            fi
          done

  publish:
    needs: preflight
    name: Publish ${{ matrix.component }} image
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: api
            image: fab-api
            context: .
            dockerfile: Dockerfile
          - component: dashboard
            image: fab-dashboard
            context: ./web
            dockerfile: Dockerfile
    steps:
      - name: Check out the published release tag
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish immutable release image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.context }}/${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ghcr.io/robert-velhorst/${{ matrix.image }}:${{ github.ref_name }}
          provenance: mode=max
          sbom: true
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.title=FAB ${{ matrix.component }}
            org.opencontainers.image.version=${{ github.ref_name }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  promote-edge:
    needs: publish
    name: Promote edge aliases after both images publish
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      packages: write
    strategy:
      fail-fast: true
      matrix:
        image: [fab-api, fab-dashboard]
    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Promote immutable release image to edge
        env:
          IMAGE: ghcr.io/robert-velhorst/${{ matrix.image }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          docker buildx imagetools create --tag "$IMAGE:edge" "$IMAGE:$RELEASE_TAG"

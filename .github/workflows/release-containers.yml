name: Publish FAB containers

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: fab-container-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish ${{ matrix.component }} image
    if: github.repository == 'Robert-Velhorst/019-FAB'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: api
            context: .
            dockerfile: Dockerfile
          - component: dashboard
            context: ./web
            dockerfile: ./web/Dockerfile
    steps:
      - name: Check out tagged source and history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Validate release tag and main-branch ancestry
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "Release tags must use vMAJOR.MINOR.PATCH with an optional prerelease or build suffix." >&2
            exit 1
          fi
          git fetch --no-tags origin main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$RELEASE_SHA" refs/remotes/origin/main; then
            echo "The tagged commit must be reachable from main." >&2
            exit 1
          fi

      - name: Require successful FAB verification for tagged commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          deadline=$((SECONDS + 1800))
          while (( SECONDS < deadline )); do
            run_state="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${RELEASE_SHA}&event=push&branch=main&per_page=20" \
              --jq "[.workflow_runs[] | select(.head_sha == \"${RELEASE_SHA}\" and .head_branch == \"main\")] | sort_by([.run_number, .run_attempt]) | last | if . == null then empty else [.status, (.conclusion // \"\")] | @tsv end")"
            if [[ -z "$run_state" ]]; then
              sleep 15
              continue
            fi

            IFS=$'\t' read -r status conclusion <<< "$run_state"
            if [[ "$status" == "completed" ]]; then
              if [[ "$conclusion" == "success" ]]; then
                echo "FAB verification passed for ${RELEASE_SHA}."
                exit 0
              fi
              echo "Refusing to publish: FAB verification concluded ${conclusion:-without success}." >&2
              exit 1
            fi
            sleep 15
          done

          echo "Refusing to publish: no successful FAB verification completed for ${RELEASE_SHA} within 30 minutes." >&2
          exit 1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare image metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ghcr.io/robert-velhorst/019-fab-${{ matrix.component }}
          tags: |
            type=semver,pattern={{version}}
            type=sha,format=long

      - name: Build and publish image
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=ci-${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=ci-${{ matrix.component }}
          provenance: mode=max
          sbom: true

      - name: Record published image digest
        shell: bash
        env:
          IMAGE: ghcr.io/robert-velhorst/019-fab-${{ matrix.component }}
          DIGEST: ${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          {
            echo "### ${IMAGE}"
            echo
            echo "- Digest: \`${DIGEST}\`"
            echo "- Tags:"
            while IFS= read -r tag; do
              [[ -n "$tag" ]] && echo "  - \`${tag}\`"
            done <<< "$TAGS"
          } >> "$GITHUB_STEP_SUMMARY"

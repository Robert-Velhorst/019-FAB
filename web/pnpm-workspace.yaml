packages:
  - "."

patchedDependencies:
  wouter@3.13.0: patches/wouter@3.13.0.patch

overrides:
  "@esbuild-kit/core-utils>esbuild": 0.28.2
  katex: 0.19.1
  proxy-addr: 2.0.8
  source-map-js: 1.2.2

onlyBuiltDependencies:
  - "@tailwindcss/oxide"
  - esbuild

allowBuilds:
  "@tailwindcss/oxide": true
  esbuild: true

engineStrict: true

# Keep pnpm12's existing one-day release quarantine explicit and inspectable.
minimumReleaseAge: 1440
